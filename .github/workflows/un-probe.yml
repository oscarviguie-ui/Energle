name: UN energy probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p data/build; O=data/build/un_probe.txt; : > $O
          K='A.250..121+122+1231+1232+1234+1235+11'
          for U in "https://data.un.org/WS/rest/data/UNSD,DF_UNDATA_ENERGY,latest/$K?startPeriod=2021" "https://data.un.org/WS/rest/data/DF_UNDATA_ENERGY/$K?startPeriod=2021" "https://data.un.org/WS/rest/data/UNSD,DF_UNDATA_ENERGY,1.2/$K?startPeriod=2021" "https://data.un.org/WS/rest/data/UNSD,DF_UNDATA_ENERGY,1.1/$K?startPeriod=2021"; do
            echo "== $U" >> $O
            curl -sSL -m 180 -H 'Accept: application/vnd.sdmx.data+csv;version=1.0.0' "$U" -w "\n%{http_code} %{size_download}\n" 2>&1 | head -c 6000 >> $O || true
          done
          echo "== versions" >> $O
          curl -sSL -m 60 "https://data.un.org/WS/rest/dataflow/UNSD/DF_UNDATA_ENERGY" | head -c 1500 >> $O || true
          echo "== all countries, electricity households, size + years" >> $O
          curl -sSL -m 300 -H 'Accept: application/vnd.sdmx.data+csv;version=1.0.0' "https://data.un.org/WS/rest/data/DF_UNDATA_ENERGY/A..7000.1231?startPeriod=2018" -o e.csv -w "%{http_code} %{size_download}\n" >> $O 2>&1 || true
          head -3 e.csv >> $O; python3 -c "
          import csv,collections; r=list(csv.DictReader(open('e.csv'))); c=collections.Counter(x.get('TIME_PERIOD') for x in r); print(sorted(c.items())); print(r[0].keys() if r else '')" >> $O 2>&1 || true
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add data/build/un_probe.txt; git commit -m "UN energy probe" || true; git push
