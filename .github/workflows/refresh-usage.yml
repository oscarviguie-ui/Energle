name: Refresh energy use by sector (UN)
on:
  schedule: [{ cron: '45 6 4 * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch UN energy statistics
        run: python scripts/fetch_un_energy.py
      - name: Build the game file
        run: if [ -f scripts/build_usage.py ]; then python scripts/build_usage.py; fi
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add data/build/un_energy.json data/usage.json 2>/dev/null || git add data/build/un_energy.json
          git commit -m "Auto-refresh: energy use by sector $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
