name: EIA probe (one-off)

# Lists the EIA international series for France (codes, names, units, years) so the total-energy layer
# reads the right ones. Writes data/build/eia_probe.txt. Safe to delete once used.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fossil fuel use for a few countries
        run: |
          python3 - <<'PY'
          import io, json, zipfile, urllib.request
          raw = urllib.request.urlopen('https://api.eia.gov/bulk/INTL.zip', timeout=600).read()
          z = zipfile.ZipFile(io.BytesIO(raw)); out = []
          want = {'4411': 'coal', '4413': 'gas', '4415': 'oil', '4417': 'nuclear', '4418': 'renew_other', '44': 'total'}
          isos = ['FRA', 'NOR', 'SAU', 'BRA', 'JPN', 'IND', 'DEU', 'ETH', 'PRY', 'USA', 'CHN', 'WLD']
          with z.open(z.namelist()[0]) as f:
              for line in f:
                  try: d = json.loads(line)
                  except ValueError: continue
                  sid = d.get('series_id') or ''
                  parts = sid.replace('INTL.', '').split('-')
                  if len(parts) == 4 and parts[1] == '2' and parts[3] == 'QBTU.A' and parts[0] in want and parts[2] in isos:
                      for y, v in d.get('data') or []:
                          if str(y)[:4] in ('2024', '2023', '2000'):
                              try: out.append('%s\t%s\t%s\t%.1f' % (parts[2], want[parts[0]], str(y)[:4], float(v) * 293.071))
                              except (TypeError, ValueError): pass
          open('data/build/eia_probe.txt', 'w').write('iso\tfuel\tyear\tTWh\n' + '\n'.join(sorted(out)) + '\n')
          print(len(out), 'rows')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/build/eia_probe.txt
          git commit -m "EIA probe: fossil fuel use for a few countries" || true
          git pull --rebase --autostash && git push
